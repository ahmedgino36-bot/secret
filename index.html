<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Secret Love</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column}
.box{background:rgba(0,0,0,.5);padding:25px;border-radius:20px;max-width:900px;text-align:center}
.hidden{display:none}
button{padding:10px 18px;border:none;border-radius:10px;background:hotpink;color:#fff;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.gallery img{width:100%;height:120px;border-radius:10px;object-fit:cover}
.card{background:rgba(255,255,255,.1);padding:10px;border-radius:10px;cursor:pointer}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.message{background:rgba(255,105,180,.2);padding:15px;border-radius:10px;margin-top:10px}
.poem-card{background:rgba(255,255,255,.1);padding:10px;border-radius:10px;margin:5px;cursor:pointer}
.poems{display:flex;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<div class="center" id="login">
<div class="box">
<h2>Enter Password 💖</h2>
<input id="pass" type="password"><br>
<button onclick="check()">Unlock</button>
</div>
</div>

<div class="center hidden" id="main">
<div class="box">
<h1>Welcome My Love 💕</h1>

<div id="counter"></div>

<button onclick="showMessage()">اضغطي هنا 💌</button>
<div class="message" id="msg" style="display:none">رسالة أول سنة ❤️</div>

<h3>📸 الجاليري</h3>
<div class="gallery">
<img src="image1.jpg"><img src="image2.jpg"><img src="image3.jpg"><img src="image4.jpg"><img src="image5.jpg"><img src="image6.jpg">
</div>

<h3>💳 الكروت</h3>
<div class="cards">
<div class="card" onclick="openCard('day')">أحلى يوم 🌹</div>
<div class="card" onclick="openCard('talk')">أول كلام 💬</div>
<div class="card" onclick="openCard('laugh')">أول ضحكة ❤️</div>
</div>
<div class="message" id="cardMsg"></div>

<h3>✨ مملكة الشعر</h3>
<button onclick="randomPoem()">قصيدة جديدة 💖</button>
<div class="poems">
<div class="poem-card" onclick="showPoem(0)">قصيدة 1</div>
<div class="poem-card" onclick="showPoem(1)">قصيدة 2</div>
<div class="poem-card" onclick="showPoem(2)">قصيدة 3</div>
</div>
<div class="message" id="poemBox"></div>

<audio id="music" loop>
<source src="love.mp3" type="audio/mp3">
</audio>

</div>
</div>

<script>
function check(){
if(document.getElementById('pass').value==='love2026'){
login.classList.add('hidden');
main.classList.remove('hidden');
music.play();
startCounter();
setInterval(startCounter,1000);
}
}

function showMessage(){msg.style.display='block';typeWriter(msg,'عدت سنة من أجمل سنين حياتي معاكي ❤️');}

function openCard(t){
let txt='';
if(t==='day') txt='اليوم اللي عرفتك فيه غير حياتي ❤️';
if(t==='talk') txt='8/7 كانت أول مكالمة بينا 💬';
if(t==='laugh') txt='كل لحظة معاكي أحلى ❤️';
cardMsg.innerText=txt;
}

const poems=[
'بحبك حب ملوش حدود ❤️',
'يا أجمل حاجة في حياتي 💖',
'معاكي الدنيا ليها طعم تاني 🌹'
];

function showPoem(i){
    const text = poems[i];
    typeWriter(poemBox,text);
    speak(text);
}
function randomPoem(){
    let i=Math.floor(Math.random()*poems.length);
    showPoem(i);
}

function typeWriter(el,text){
el.innerHTML='';let i=0;
let intr=setInterval(()=>{
el.innerHTML+=text[i];i++;
if(i>=text.length) clearInterval(intr);
},40);
}

function startCounter(){
let start=new Date('2025-04-08');
let now=new Date();
let s=Math.floor((now-start)/1000);
let y=Math.floor(s/(365*24*3600));s%=365*24*3600;
let m=Math.floor(s/(30*24*3600));s%=30*24*3600;
let d=Math.floor(s/(24*3600));s%=24*3600;
let h=Math.floor(s/3600);s%=3600;
let min=Math.floor(s/60);
let sec=s%60;
counter.innerHTML=`${y}س ${m}ش ${d}ي ${h}س ${min}د ${sec}ث`;
}
function speak(text){
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = 'ar-EG';
    speech.rate = 1;
    speech.pitch = 1.2;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
